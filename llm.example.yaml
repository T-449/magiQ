# Copy to llm.yaml and point it at your endpoint.
# setup.sh does this for you if llm.yaml does not already exist.
#
# api_key may be set here directly, or left out so that the environment
# variable named by api_key_env is used instead.

model: gpt-4o-mini
base_url: https://api.openai.com/v1
api_key_env: OPENAI_API_KEY

